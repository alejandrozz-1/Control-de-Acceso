name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  supabase-lint:
    # Solo si cambian migraciones: advisors de seguridad (0 ERROR obligatorio)
    if: contains(github.event.head_commit.message, 'supabase') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check advisors de seguridad vía Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Sin SUPABASE_ACCESS_TOKEN (secret no configurado) — skip"; exit 0; fi
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects/bipcvxetgypugwnbhmwm/advisors/security \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const l=JSON.parse(d).lints||[];const e=l.filter(x=>x.level==='ERROR');console.log('ERRORS:',e.length,'WARNs:',l.length-e.length);e.forEach(x=>console.log(x.name,x.detail));process.exit(e.length?1:0)})"
